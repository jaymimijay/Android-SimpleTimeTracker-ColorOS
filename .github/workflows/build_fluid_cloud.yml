name: Build with Fluid Cloud (OPPO)

on:
  # 手动触发
  workflow_dispatch:
  # 推送到指定分支时自动触发
  push:
    branches: [ dev, main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android API 36 (Android 16)
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build base debug APK
        run: ./gradlew :app:assembleBaseDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-time-tracker-fluid-cloud-apk
          path: app/build/outputs/apk/base/debug/*.apk
          retention-days: 7
